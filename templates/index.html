<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human Facial Emotion Recognition</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(to bottom, #ffeaa7, #fdcb6e, #e17055);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .floating-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .shape {
            position: absolute;
            opacity: 0.15;
            animation: float-random 25s infinite ease-in-out;
        }

        .shape:nth-child(1) {
            width: 80px;
            height: 80px;
            background: #ff6b6b;
            border-radius: 50%;
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .shape:nth-child(2) {
            width: 60px;
            height: 60px;
            background: #4ecdc4;
            border-radius: 50%;
            top: 60%;
            right: 15%;
            animation-delay: 3s;
        }

        .shape:nth-child(3) {
            width: 100px;
            height: 100px;
            background: #95e1d3;
            border-radius: 50%;
            bottom: 20%;
            left: 20%;
            animation-delay: 6s;
        }

        @keyframes float-random {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(30px, -40px) rotate(90deg); }
            50% { transform: translate(-20px, 30px) rotate(180deg); }
            75% { transform: translate(40px, 20px) rotate(270deg); }
        }

        h1 {
            color: #2d3436;
            font-size: 3.2em;
            margin-bottom: 10px;
            font-weight: 400;
            font-style: italic;
            white-space: nowrap;
        }

        .subtitle {
            color: #636e72;
            font-size: 1.1em;
            margin-bottom: 40px;
            font-weight: 300;
        }

        .container {
            background: #fff;
            padding: 60px 55px;
            width: 100%;
            max-width: 700px;
            border-radius: 25px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            position: relative;
            z-index: 1;
        }

        .decorative-line {
            width: 80px;
            height: 4px;
            background: linear-gradient(to right, #ff6b6b, #4ecdc4);
            margin: 0 auto 30px;
            border-radius: 2px;
        }

        .upload-area {
            border: 3px solid #dfe6e9;
            border-radius: 15px;
            padding: 60px 30px;
            margin: 30px 0;
            transition: all 0.4s ease;
            background: #f8f9fa;
            cursor: pointer;
            position: relative;
        }

        .upload-area:hover {
            border-color: #ff6b6b;
            background: #fff5f5;
        }

        .upload-icon {
            font-size: 4em;
            margin-bottom: 18px;
            display: block;
        }

        .upload-text {
            color: #636e72;
            font-size: 1.15em;
            font-weight: 400;
        }

        input[type="file"] {
            display: none;
        }

        button {
            margin-top: 30px;
            padding: 18px 50px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
            border: none;
            color: white;
            font-size: 18px;
            font-weight: 500;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.3);
            width: 100%;
            font-family: 'Georgia', serif;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(255, 107, 107, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        #preview {
            margin-top: 40px;
            width: 100%;
            max-width: 400px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            display: none;
        }

        .result {
            margin-top: 30px;
            padding: 25px;
            font-size: 26px;
            font-weight: 500;
            color: #2d3436;
            background: linear-gradient(135deg, #ffeaa7, #fdcb6e);
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(253, 203, 110, 0.3);
            display: none;
        }

        .error {
            color: #d63031;
            margin-top: 20px;
            padding: 15px;
            background: #ffe0e0;
            border-radius: 10px;
        }

        .emoji-result {
            font-size: 5em;
            margin: 20px 0;
        }

        .emotion-label {
            font-style: italic;
            color: #636e72;
            font-size: 0.7em;
            display: block;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>

<div class="floating-shapes">
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
</div>

<div class="container">
    <h1>Facial Emotion Reader</h1>
    <div class="decorative-line"></div>
    <p class="subtitle">Unveil the feelings within every smile</p>

    <form id="uploadForm" enctype="multipart/form-data">
        <div class="upload-area" id="uploadArea">
            <span class="upload-icon">📤</span>
            <p class="upload-text">Choose a photo to analyze</p>
            <input type="file" id="imageInput" name="image" accept="image/*" required>
        </div>
        <button type="submit">Reveal Emotion</button>
    </form>

    <img id="preview" alt="Uploaded Image">

    <div id="resultSection" class="result">
        <div class="emoji-result" id="emojiDisplay"></div>
        <span class="emotion-label">Detected Emotion:</span>
        <span id="emotionText"></span>
    </div>
</div>

<script>
    const uploadArea = document.getElementById('uploadArea');
    const imageInput = document.getElementById('imageInput');
    const preview = document.getElementById('preview');
    const form = document.getElementById('uploadForm');
    const resultSection = document.getElementById('resultSection');
    const emojiDisplay = document.getElementById('emojiDisplay');
    const emotionText = document.getElementById('emotionText');

    // Click to upload
    uploadArea.addEventListener('click', () => {
        imageInput.click();
    });

    // Preview image on selection
    imageInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    });

    // Handle form submission
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        // Simulate emotion detection (replace with actual API call)
        const emotions = ['Happy', 'Sad', 'Angry', 'Surprised', 'Fear', 'Disgust', 'Neutral'];
        const emojis = {
            'Happy': '😊',
            'Sad': '😢',
            'Angry': '😠',
            'Surprised': '😮',
            'Fear': '😨',
            'Disgust': '🤢',
            'Neutral': '😐'
        };
        
        // Random emotion for demo (replace with actual prediction)
        const randomEmotion = emotions[Math.floor(Math.random() * emotions.length)];
        
        // Display result
        emojiDisplay.textContent = emojis[randomEmotion];
        emotionText.textContent = randomEmotion;
        resultSection.style.display = 'block';
    });
</script>

</body>
</html>
